name: Service

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: ruff format --check
      - run: mypy src
      - run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the session bus and the keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
      - run: pip install -e '.[dev]'
      - name: Run the integration tests
        run: |
          # Exit code 5 means that no integration test exists yet.
          dbus-run-session -- pytest -m integration || [ $? -eq 5 ]
