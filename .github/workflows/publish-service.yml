name: Publish the service

on:
  push:
    tags:
      - "service-v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare the tag with the version of the package
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' service/src/tokengrill/__init__.py)
          if [ "service-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version"
            exit 1
          fi
      - run: pip install build
      - run: python -m build service --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # TestPyPI first. The PyPI job waits for the approval of the pypi environment,
  # which comes after an install from TestPyPI works.
  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tokengrill
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tokengrill
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
