[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokengrill"
dynamic = ["version"]
description = "Usage limits of AI coding services, served over D-Bus to the Token Grill GNOME Shell extension"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["dbus-fast>=5.0.26,<6", "httpx>=0.27,<1", "secretstorage>=3,<4"]

[project.urls]
Homepage = "https://github.com/sh02sahil/token-grill"
Issues = "https://github.com/sh02sahil/token-grill/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "build"]

[project.scripts]
tokengrill = "tokengrill.cli:main"

[tool.hatch.version]
path = "src/tokengrill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tokengrill"]

[tool.hatch.build.targets.sdist]
# Only the package and its tests: a stray file in service/ must not reach PyPI. Hatch always adds
# the nearest .gitignore, and no setting removes it; service/.gitignore is that file, so the one of
# the repository root stays out.
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that need a real session bus or the network"]

[[tool.mypy.overrides]]
# The annotations of dbus-fast handlers are D-Bus signature strings.
module = "tokengrill.dbus.interface"
disable_error_code = ["name-defined", "valid-type", "syntax"]

[tool.ruff.lint.per-file-ignores]
"src/tokengrill/dbus/interface.py" = ["F821", "F722"]

[[tool.mypy.overrides]]
# jeepney, the transport of secretstorage, ships no type information.
module = "jeepney.*"
ignore_missing_imports = true
